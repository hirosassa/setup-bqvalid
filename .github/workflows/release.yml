name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Sanity-check the tagged commit before publishing.
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: bats
        run: bats test/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease_flag=""
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            ${prerelease_flag}

      - name: Update sliding major version tag
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease tag ${GITHUB_REF_NAME}; skipping major tag update"
            exit 0
          fi
          major="${GITHUB_REF_NAME%%.*}"   # v1.2.3 -> v1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${major}" "${GITHUB_SHA}"
          git push -f origin "refs/tags/${major}"
          echo "moved ${major} -> ${GITHUB_SHA}"
